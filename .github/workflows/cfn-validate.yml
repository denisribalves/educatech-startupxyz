name: CloudFormation validation

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - ".github/workflows/cfn-validate.yml"
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - ".github/workflows/cfn-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint CloudFormation templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cfn-lint
        run: python -m pip install --upgrade cfn-lint

      - name: Discover and lint templates
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d infrastructure ]; then
            echo "::warning::Directory infrastructure/ not found yet; add reviewed templates before relying on this check."
            exit 0
          fi
          mapfile -t templates < <(find infrastructure -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)
          if [ "${#templates[@]}" -eq 0 ]; then
            echo "::warning::No CloudFormation templates found under infrastructure/. Add reviewed templates before relying on this check."
            exit 0
          fi
          cfn-lint "${templates[@]}"
